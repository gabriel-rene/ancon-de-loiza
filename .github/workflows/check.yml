name: Check
on:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'check-${{ github.ref }}', cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # `build` runs tsc --noEmit before vite build. Playwright e2e stays local (slow on CI's software GL).
      - run: npm run build
