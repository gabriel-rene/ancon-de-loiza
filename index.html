    <style>
      /* Load card (spec 7a §4): shown before the bundle runs. The green field and the station sign; same field as the era dip (.era-dip in src/styles.css). */
      @font-face { font-family: 'Archivo'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%;
        src: url('/fonts/archivo-latin.woff2') format('woff2-variations'); }
      #load-card { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 42%, #2a5f43 0%, #1e4a33 55%, #143625 100%); color: #e7ece3; transition: opacity 0.6s ease; }
      #load-card.load-card--out { opacity: 0; pointer-events: none; }
      .load-card__sign { display: block; width: min(560px, 82vw); height: auto; filter: drop-shadow(0 14px 22px rgba(8, 20, 14, 0.45)); }
      .load-card__year { margin-top: clamp(26px, 5vh, 44px); font: 900 clamp(44px, 9vw, 76px)/0.8 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; font-stretch: 68%;
        font-variant-numeric: tabular-nums lining-nums; }
      .load-card__bar { width: min(560px, 82vw); height: 2px; margin-top: 22px; background: rgba(231, 236, 227, 0.28); overflow: hidden; }
      .load-card__fill { width: 100%; height: 100%; background: #e7ece3; transform: scaleX(0); transform-origin: left center; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
      body[data-load='code'] .load-card__fill { transform: scaleX(0.33); }
      body[data-load='scene'] .load-card__fill { transform: scaleX(0.67); }
      body[data-ready] .load-card__fill { transform: scaleX(1); }
      .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .noscript { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 42%, #2a5f43 0%, #1e4a33 55%, #143625 100%);
        color: #e7ece3; font: 400 17px/1.5 'Archivo', ui-sans-serif, system-ui, sans-serif; }
      .noscript img { width: min(480px, 82vw); height: auto; margin-bottom: 22px; }
      .noscript a { color: #f2c46d; text-underline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { #load-card, .load-card__fill { transition: none; } }
    </style>
    <noscript><style>#load-card { display: none; }</style></noscript>
  </head>
  <body>
    <noscript>
      <div class="noscript">
        <img src="./docs/assets/el-ancon-de-loiza-sign.svg#svgView(viewBox(35,29,856,142))" alt="El Ancón de Loíza" width="856" height="142" />
        <p>Este sitio necesita JavaScript y WebGL para mostrar la escena 3D.</p>
        <p lang="en">This site needs JavaScript and WebGL to show the 3D scene.</p>
        <p><a href="https://github.com/gabriel-rene/ancon-de-loiza/blob/main/docs/research/ancon-research.md">Investigación y fuentes · Research and sources</a></p>
      </div>
    </noscript>
    <div id="load-card" role="status">
      <img class="load-card__sign" src="./docs/assets/el-ancon-de-loiza-sign.svg#svgView(viewBox(35,29,856,142))" alt="El Ancón de Loíza" width="856" height="142" />
      <div class="load-card__year" id="load-card-year">1975</div>
      <div class="load-card__bar" aria-hidden="true"><div class="load-card__fill"></div></div>
      <span class="sr-only" id="load-card-text">Cargando</span>
    </div>
    <script>
      /* load-card:boot */
      // Must match ERA_IDS and DEFAULT_ERA in src/data/eras.ts / src/state/store.ts and detectLang in src/i18n/text.ts (src/ui/loadCard.test.ts).
      function anconLoadCard(search, navLang) {
        var eras = ['1840', '1900', '1925', '1935', '1959', '1975', '1984', '1986'];
        var p = new URLSearchParams(search), era = p.get('era'), lang = p.get('lang');
        if (lang !== 'es' && lang !== 'en') lang = (navLang || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'es';
        return { year: eras.indexOf(era) >= 0 ? era : '1975', lang: lang };
      }
      /* load-card:end */
      (function () {
        var r = anconLoadCard(location.search, navigator.language);
        document.getElementById('load-card-year').textContent = r.year;
        document.getElementById('load-card-text').textContent = r.lang === 'en' ? 'Loading' : 'Cargando';
        document.documentElement.lang = r.lang;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
